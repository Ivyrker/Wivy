<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; frame-src about: https://music.youtube.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; img-src 'self' data: file: blob: https://*.ytimg.com https://*.ggpht.com https://*.googleusercontent.com https://*.sndcdn.com https://*.vkuser.net https://*.vkuseraudio.net https://*.vkuseraudio.ru https://*.vk-cdn.net https://*.userapi.com https://*.vkuserphoto.ru https://*.vk.com https://*.vk.ru https://*.vk.me https://*.mycdn.me https://*.okcdn.ru; media-src 'self' blob: file: https://*.sndcdn.com https://*.soundcloud.cloud https://*.vkuser.net https://*.vkuseraudio.net https://*.vkuseraudio.ru https://*.vk-cdn.net https://*.userapi.com https://*.vkuserphoto.ru https://*.vk.com https://*.vk.ru https://*.vk.me https://*.mycdn.me https://*.okcdn.ru; connect-src 'self' https://*.sndcdn.com https://*.soundcloud.cloud https://*.vkuser.net https://*.vkuseraudio.net https://*.vkuseraudio.ru https://*.vk-cdn.net https://*.userapi.com https://*.vkuserphoto.ru https://*.vk.com https://*.vk.ru https://*.vk.me https://*.mycdn.me https://*.okcdn.ru">
  <title>Wivy</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- слой обоев: лежит под всем интерфейсом -->
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

  <div class="app">
    <!-- Свой верхний бар окна, как в Discord: стрелки назад/вперёд слева, название раздела по центру,
         свои кнопки окна справа (рисуются в renderer.js). -->
    <header class="titlebar">
      <div class="tb-nav">
        <button class="tb-btn" id="tbBack" title="Back (Alt+←)" aria-label="Back" disabled></button>
        <button class="tb-btn" id="tbForward" title="Forward (Alt+→)" aria-label="Forward" disabled></button>
      </div>
      <div class="tb-title" id="tbTitle"></div>
      <div class="wc" id="winControls"></div>
    </header>

    <!-- Левая панель с платформами (на всю высоту под баром) -->
    <nav class="rail" id="rail"></nav>

    <!-- Верхняя панель + содержимое -->
    <main class="main">
      <header class="topbar">
        <div class="plat-chip" id="title"></div>
        <div class="tabs" id="tabs"></div>
        <label class="search" id="searchBox">
          <span id="searchIcon"></span>
          <input id="searchInput" type="text" placeholder="Search tracks">
        </label>
      </header>
      <!-- прокручивается вся область; основное полотно (#content) по высоте равно содержимому,
           поэтому его скруглённый низ уходит за экран вместе с концом списка -->
      <div class="scroller">
        <div class="canvas" id="content"></div>
      </div>
      <!-- свой ползунок прокрутки: лежит внутри рамки полотна -->
      <div class="vscroll" id="vscroll" aria-hidden="true"><div class="vthumb" id="vthumb"></div></div>

      <!-- Панель текущей очереди: выезжает снизу, обрезается верхним краем нижнего плеера -->
      <aside class="queue" id="queuePanel" aria-hidden="true">
        <div class="queue-box">
          <div class="queue-head">
            <div class="queue-heading">
              <div class="queue-titlerow">
                <span class="queue-title" id="queueTitle"></span>
                <div class="q-plats" id="queuePlats"></div>
              </div>
              <div class="queue-sub" id="queueSub"></div>
            </div>
            <button class="icon-btn" id="queueClose" aria-label="Close"></button>
          </div>
          <div class="queue-list" id="queueList"></div>
        </div>
      </aside>
    </main>

    <!-- Нижний плеер в стиле SoundCloud -->
    <footer class="player">
      <div class="transport">
        <button class="icon-btn" id="prevBtn" title="Previous"></button>
        <button class="play-btn" id="playBtn" title="Play"></button>
        <button class="icon-btn" id="nextBtn" title="Next"></button>
        <button class="icon-btn" id="shuffleBtn" title="Shuffle off"></button>
        <button class="icon-btn" id="repeatBtn" title="Repeat off"></button>
      </div>

      <div class="progress">
        <span id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="any" value="0">
        <span id="durTime">0:00</span>
      </div>

      <div class="volume">
        <span id="volIcon"></span>
        <div class="vol-wrap">
          <div class="vol-tip" id="volTip" aria-hidden="true">70.0%</div>
          <input type="range" id="vol" min="0" max="100" step="0.1" value="70">
        </div>
      </div>

      <div class="np">
        <div class="np-cover" id="npCover"></div>
        <div class="np-meta">
          <div class="np-artist" id="npArtist">Pick a track</div>
          <div class="np-title" id="npTitle">Nothing is playing</div>
          <div class="card-src np-src" id="npSrc"></div>
        </div>
        <button class="icon-btn heart" id="likeBtn" title="Like"></button>
        <button class="icon-btn" id="videoBtn" title="Video" aria-label="Video" hidden></button>
        <button class="icon-btn" id="queueBtn" aria-label="Queue"></button>
      </div>
    </footer>
  </div>

  <!-- Экран загрузки при запуске: пока подключённые сервисы проверяют вход и грузят библиотеку -->
  <div class="boot" id="boot" hidden>
    <div class="boot-card">
      <img class="boot-logo" src="icon-pixel.png" alt="" aria-hidden="true" draggable="false">
      <div class="boot-spin" aria-hidden="true"></div>
      <div class="boot-title" id="bootTitle">Loading your music…</div>
      <div class="boot-list" id="bootList"></div>
      <button class="btn" id="bootSkip">Skip</button>
    </div>
  </div>

  <!-- Окно настроек поверх приложения -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
      <nav class="modal-nav">
        <label class="nav-search">
          <span id="navSearchIcon"></span>
          <input id="settingsSearch" type="text" placeholder="Search settings" autocomplete="off">
        </label>
        <div class="nav-tree" id="navTree"></div>
      </nav>
      <div class="modal-body" id="modalBody"></div>
      <button class="close" id="closeBtn" title="Close (Esc)" aria-label="Close"></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
